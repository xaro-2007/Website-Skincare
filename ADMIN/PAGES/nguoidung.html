<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý người dùng - Julie Skin</title>
    <link rel="stylesheet" href="../CSS/admin.css">

    <style>
        #user-dialog {
            margin: auto;
            width: min(540px, calc(100% - 32px));
            max-height: 90vh;
            overflow-y: auto;
            padding: 24px;
            border: none;
            border-radius: 16px;
            box-shadow: 0 12px 40px #0002;
        }

        #user-dialog::backdrop {
            background: #30152280;
        }

        #user-form label {
            display: block;
            margin-top: 14px;
            font-size: 13px;
            font-weight: bold;
            color: #514650;
        }

        #user-form input,
        #user-form select {
            width: 100%;
            margin-top: 6px;
            padding: 10px 12px;
            border: 1px solid #ead6df;
            border-radius: 8px;
            font: inherit;
        }

        #user-form .form-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <aside class="sidebar">
        <h2>Julie<span>Skin</span></h2>
        <p class="label">ADMIN PANEL</p>

        <nav id="menu">
            <a href="admin.html">Tổng quan</a>
            <a href="donhang.html">Đơn hàng</a>
            <a href="sanpham.html">Sản phẩm</a>
            <a href="tinnhan.html">Liên hệ</a>
            <a href="nguoidung.html" class="active">Người dùng</a>
        </nav>

        <button class="logout" onclick="logoutAdmin()">
            Đăng xuất
        </button>  
    </aside>

    <main class="content">
        <header class="page-header">
            <div>
                <h1>Quản lý người dùng</h1>
                <p class="subtitle">
                    Thêm, cập nhật và quản lý tài khoản Admin/User.
                </p>
            </div>

            <div>
                <button id="add-user-btn" class="primary" type="button">
                    + Thêm người dùng
                </button>
            </div>
        </header>

        <!-- THỐNG KÊ -->
        <section class="cards">
            <article class="card">
                <h3>Tổng người dùng</h3>
                <p id="total-users">0</p>
            </article>

            <article class="card">
                <h3>Quản trị viên</h3>
                <p id="total-admins">0</p>
            </article>

            <article class="card">
                <h3>Đang hoạt động</h3>
                <p id="total-active">0</p>
            </article>
        </section>

        <!-- TÌM KIẾM VÀ LỌC -->
        <section class="panel">
            <div class="product-toolbar">
                <input
                    id="user-search"
                    type="search"
                    placeholder="Tìm theo tên, tài khoản hoặc email..."
                    aria-label="Tìm người dùng"
                >

                <select id="role-filter" aria-label="Lọc vai trò">
                    <option value="all">Tất cả vai trò</option>
                    <option value="admin">Quản trị viên</option>
                    <option value="user">Khách hàng</option>
                </select>
            </div>

            <div class="table-wrapper">
                <table class="admin-table">
                    <thead>
                        <tr>
                            <th>Họ tên</th>
                            <th>Tài khoản</th>
                            <th>Email</th>
                            <th>Vai trò</th>
                            <th>Trạng thái</th>
                            <th>Thao tác</th>
                        </tr>
                    </thead>

                    <tbody id="user-table-body"></tbody>
                </table>
            </div>

            <p id="empty-users" hidden>
                Chưa có người dùng phù hợp.
            </p>

            <!-- <p class="note">
                Dữ liệu người dùng demo được lưu trong trình duyệt hiện tại.
            </p> -->
        </section>
    </main>

    <!-- FORM THÊM / SỬA NGƯỜI DÙNG -->
    <dialog id="user-dialog">
        <form id="user-form">
            <div class="dialog-header">
                <h2 id="user-dialog-title">Thêm người dùng</h2>

                <button
                    id="close-user-dialog"
                    class="close-btn"
                    type="button"
                    aria-label="Đóng"
                >&times;</button>
            </div>

            <input type="hidden" id="user-id">

            <label for="user-name">Họ và tên *</label>
            <input
                id="user-name"
                type="text"
                required
                maxlength="60"
                placeholder="Ví dụ: Nguyễn Thu Linh"
            >

            <label for="user-username">Tài khoản *</label>
            <input
                id="user-username"
                type="text"
                required
                maxlength="30"
                placeholder="Ví dụ: linhnguyen"
            >

            <label for="user-email">Email *</label>
            <input
                id="user-email"
                type="email"
                required
                placeholder="Ví dụ: linh.nguyen@gmail.com"
            >

            <label for="user-phone">Số điện thoại</label>
            <input
                id="user-phone"
                type="tel"
                maxlength="15"
                placeholder="Ví dụ: 0905123456"
            >

            <label for="user-role">Vai trò *</label>
            <select id="user-role" required>
                <option value="user">Khách hàng</option>
                <option value="admin">Quản trị viên</option>
            </select>

            <label for="user-status">Trạng thái *</label>
            <select id="user-status" required>
                <option value="active">Đang hoạt động</option>
                <option value="locked">Đã khóa</option>
            </select>

            <div class="form-actions">
                <button id="cancel-user-dialog" class="small" type="button">
                    Hủy
                </button>

                <button class="primary" type="submit">
                    Lưu người dùng
                </button>
            </div>
        </form>
    </dialog>

    <script src="../JS/admin-data.js"></script>
    <script src="../JS/admin-nguoidung.js"></script>
        <script src="../JS/admin.js"></script>

</body>
</html>
